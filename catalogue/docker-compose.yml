include:
  - path: ../include/app_net.yml
    project_directory: .

name: ${INSTANCE_NAME}

services:
  maitredescles:
    image: "replace_me"
    x-millegrilles-certificat:
      roles:
        - maitredescles
        - maitrecles
      exchanges:
        - 4.secure
        - 3.protege
        - 2.prive
        - 1.public
      domaines:
        - MaitreDesCles
      split: true
    environment:
      - MG_MQ_HOST=${MQ_HOSTNAME:-mq}
      - MG_MQ_PORT=${MQ_PORT:-5673}
      - MG_MIDCOMPTE_URL=https://midcompte:2444
      - MG_MONGO_HOST=mongo
      - MG_MQ_SSL=on
      - MG_MQ_AUTH_CERT=on
      - CERTFILE=/run/secrets/cert.pem
      - KEYFILE=/run/secrets/key.pem
      - CAFILE=/run/secrets/millegrille.pem
      - MG_REDIS_URL=rediss://client_rust@redis:6379#insecure
      - MG_REDIS_PASSWORD_FILE=/run/secrets/redis.txt
      - RUST_LOG=warn,millegrilles_common_rust=info
      - MG_MAITREDESCLES_MODE=CA_partition
    volumes:
      - ${MILLEGRILLES_ROOT}/var/backup/domains:/var/opt/millegrilles/archives
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 250M
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 1000
    configs:
      - source: maitredescles
        target: /run/secrets/cert.pem
      - source: mgca
        target: /run/secrets/millegrille.pem
    secrets:
      - source: maitredescles
        target: key.pem
      - source: passwd_redis
        target: redis.txt
    networks:
      - app_net

configs:
  maitredescles:
    file: ${MILLEGRILLES_ROOT}/secrets/maitredescles.cert.pem
  mgca:
    file: ${MILLEGRILLES_ROOT}/etc/millegrille.pem

secrets:
  maitredescles:
    file: ${MILLEGRILLES_ROOT}/secrets/maitredescles.key.pem
  passwd_redis:
    file: ${MILLEGRILLES_ROOT}/secrets/redis.txt
